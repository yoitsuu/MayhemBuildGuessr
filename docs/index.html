<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whose Build?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Whose Build?<small>ARAM Mayhem edition</small></h1>
    <div class="score" id="score"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button type="button" data-view="play">Play</button>
    <button type="button" data-view="daily">Daily</button>
    <button type="button" data-view="shame">Hall of Shame</button>
  </nav>

  <div id="playbar">
    <nav class="modes" id="modes">
      <button type="button" data-mode="player">Whose build?</button>
      <button type="button" data-mode="champ">Which champ?</button>
      <button type="button" data-mode="odd">Odd one out</button>
      <button type="button" data-mode="win">Did it win?</button>
    </nav>

    <details class="settings card" id="settings">
      <summary>Players &amp; options</summary>
      <div class="row" style="justify-content:space-between">
        <span style="color:var(--muted);font-size:13px">Include these players:</span>
        <span><button id="all" type="button">All</button> <button id="none" type="button">None</button></span>
      </div>
      <div class="players" id="players"></div>
      <div class="row">
        <label class="for-player">At round start, show
          <select id="champStart">
            <option value="none">nothing</option>
            <option value="class">champion class</option>
            <option value="champ">champion</option>
          </select></label>
        <label>Skip games from the last
          <select id="skipDays">
            <option value="0">0 days</option><option value="1">1 day</option>
            <option value="3">3 days</option><option value="7">7 days</option>
            <option value="14">14 days</option>
          </select></label>
        <label class="for-champ">Guesses per round
          <input type="number" id="tries" min="1" max="10" style="width:56px;font:inherit;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px"></label>
      </div>
      <div class="pool" id="pool"></div>
    </details>
  </div>

  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<div id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
