<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whose Build?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #182033;
    --line: #26304a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --gold: #c8a14b;
    --gold-soft: #c8a14b22;
    --good: #3fb37f;
    --bad: #e05561;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, sans-serif;
    background-image: radial-gradient(ellipse at top, #1a2440 0%, var(--bg) 60%);
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-family: Cinzel, serif; font-size: 26px; margin: 0; color: var(--gold); letter-spacing: .5px; }
  h1 small { display: block; font: 500 12px Inter, sans-serif; color: var(--muted); letter-spacing: 0; }
  .score { text-align: right; font-size: 13px; color: var(--muted); }
  .score b { color: var(--text); font-size: 18px; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  button:hover:not(:disabled) { border-color: var(--gold); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--gold); color: #1a1405; border-color: var(--gold); font-weight: 600; }

  /* settings */
  details.settings summary { cursor: pointer; color: var(--muted); font-weight: 500; list-style: none; }
  details.settings summary::before { content: "⚙  "; }
  details.settings[open] summary { color: var(--text); margin-bottom: 12px; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; user-select: none; font-size: 14px; }
  .chip input { accent-color: var(--gold); margin: 0; }
  .chip.on { border-color: var(--gold); background: var(--gold-soft); }
  .chip .n { color: var(--muted); font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .row label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  select { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
  .pool { color: var(--muted); font-size: 13px; margin-top: 10px; }

  /* round */
  .champ { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .portrait { width: 72px; height: 72px; border-radius: 10px; border: 2px solid var(--gold); background: var(--panel-2); display: grid; place-items: center; font: 700 30px Cinzel, serif; color: var(--gold); overflow: hidden; flex: none; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; }
  .champ .name { font: 700 22px Cinzel, serif; }
  .champ .sub { color: var(--muted); font-size: 13px; }
  .items { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .item { text-align: center; }
  .icon { width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); display: grid; place-items: center; overflow: hidden; font-size: 11px; color: var(--muted); padding: 2px; }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .item .label { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.25; word-break: break-word; }
  .item.empty .icon { border-style: dashed; opacity: .4; }

  .hints { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 4px; }
  .hints button { font-size: 13px; padding: 6px 10px; }
  .hint-out { margin-top: 12px; display: grid; gap: 10px; }
  .hint-out:empty { display: none; }
  .hint { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
  .hint h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  .mini { display: flex; flex-wrap: wrap; gap: 10px; }
  .mini span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .mini img, .mini .ph { width: 28px; height: 28px; border-radius: 6px; background: var(--bg); }
  .foes .foe { width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; text-align: center; color: var(--muted); }
  .foes .foe img { width: 100%; height: 100%; border-radius: 0; }
  .r-kSilver { box-shadow: 0 0 0 2px #9aa4b5; }
  .r-kGold   { box-shadow: 0 0 0 2px var(--gold); }
  .r-kPrismatic { box-shadow: 0 0 0 2px #b06cf0; }

  .guess-title { font-weight: 600; margin: 0 0 10px; }
  .guesses { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .guesses button { text-align: left; display: flex; gap: 8px; align-items: center; }
  .guesses .k { color: var(--muted); font-size: 12px; min-width: 14px; }
  .guesses button.correct { background: #3fb37f26; border-color: var(--good); }
  .guesses button.wrong { background: #e0556126; border-color: var(--bad); }
  .verdict { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .verdict .msg { font-weight: 600; }
  .verdict .msg.good { color: var(--good); }
  .verdict .msg.bad { color: var(--bad); }
  .verdict .meta { color: var(--muted); font-size: 13px; }

  /* mode switch */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 5px; margin-bottom: 14px; }
  .modes button { border: 0; background: transparent; font-weight: 600; color: var(--muted); padding: 9px; }
  .modes button.on { background: var(--gold); color: #1a1405; }
  .modes button:hover:not(.on) { color: var(--text); }

  .byline { color: var(--muted); font-size: 14px; margin: -4px 0 12px; }
  .byline b { color: var(--text); }

  /* champion picker */
  .pick-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .pick-head .guess-title { margin: 0; }
  .tries { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .tries .pips { letter-spacing: 2px; color: var(--gold); }
  .wrong-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
  .wrong-list .w { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px 3px 3px; border: 1px solid var(--bad); background: #e0556118; border-radius: 999px; color: var(--text); }
  .wrong-list .w img, .wrong-list .w .ph { width: 20px; height: 20px; border-radius: 50%; }
  .search { width: 100%; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; }
  .search:focus { outline: none; border-color: var(--gold); }
  .classes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .classes button { font-size: 12px; padding: 5px 10px; border-radius: 999px; }
  .classes button.on { border-color: var(--gold); background: var(--gold-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 8px; max-height: 380px; overflow-y: auto; padding: 2px 4px 2px 2px; }
  .grid .ch { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px; border-radius: 8px; background: transparent; border: 1px solid transparent; }
  .grid .ch .face { width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--panel-2); display: grid; place-items: center; font-size: 10px; color: var(--muted); }
  .grid .ch .face img { width: 100%; height: 100%; object-fit: cover; }
  .grid .ch span.nm { font-size: 11px; color: var(--muted); line-height: 1.2; text-align: center; word-break: break-word; }
  .grid .ch:hover:not(:disabled) { border-color: var(--gold); }
  .grid .ch.wrong { opacity: .35; }
  .grid .ch.wrong .face { outline: 2px solid var(--bad); }
  .grid .ch.correct { border-color: var(--good); background: #3fb37f26; opacity: 1; }
  .grid .ch[hidden] { display: none; }
  .grid .none { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 20px; }

  /* hover / tap popup */
  [data-tip] { cursor: help; }
  #tip {
    position: fixed; z-index: 50; max-width: 300px; pointer-events: none;
    background: #0e1420; border: 1px solid var(--gold); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 8px 24px #000a; font-size: 13px; line-height: 1.45;
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s;
  }
  #tip.show { opacity: 1; transform: none; }
  #tip .t-name { font-weight: 600; color: var(--gold); margin-bottom: 2px; }
  #tip .t-sub { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  #tip .t-desc { white-space: pre-line; color: var(--text); }
  #tip .t-none { color: var(--muted); font-style: italic; }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 10px; }
  .empty-state code { background: var(--panel-2); padding: 2px 6px; border-radius: 4px; color: var(--text); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }

  @media (max-width: 520px) {
    .items { grid-template-columns: repeat(3, 1fr); }
    .grid { grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); max-height: 320px; }
    h1 { font-size: 21px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Whose Build?<small>ARAM Mayhem edition</small></h1>
    <div class="score" id="score"></div>
  </header>

  <nav class="modes" id="modes">
    <button type="button" data-mode="player">Whose build?</button>
    <button type="button" data-mode="champ">Which champ?</button>
  </nav>

  <details class="settings card" id="settings">
    <summary>Players &amp; options</summary>
    <div class="row" style="justify-content:space-between">
      <span style="color:var(--muted);font-size:13px">Include these players:</span>
      <span><button id="all" type="button">All</button> <button id="none" type="button">None</button></span>
    </div>
    <div class="players" id="players"></div>
    <div class="row">
      <label class="for-player">At round start, show
        <select id="champStart">
          <option value="none">nothing</option>
          <option value="class">champion class</option>
          <option value="champ">champion</option>
        </select></label>
      <label>Skip games from the last
        <select id="skipDays">
          <option value="0">0 days</option><option value="1">1 day</option>
          <option value="3">3 days</option><option value="7">7 days</option>
          <option value="14">14 days</option>
        </select></label>
      <label class="for-champ">Guesses per round
        <input type="number" id="tries" min="1" max="10" style="width:56px;font:inherit;background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 6px"></label>
    </div>
    <div class="pool" id="pool"></div>
  </details>

  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<div id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script>
(() => {
  const D = window.MAYHEM_DATA;
  const $ = (s) => document.querySelector(s);
  const main = $("#main");

  if (!D || !D.rounds || !D.rounds.length) {
    main.innerHTML = `<div class="card empty-state">No games yet.<br><br>
      Run <code>python collect.py --once</code> with the League client open,
      then reload this page.</div>`;
    $("#settings").style.display = "none";
    return;
  }

  // ---------- settings (remembered per browser) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("whosebuild." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("whosebuild." + k, JSON.stringify(v)); } catch {} },
  };
  const players = D.players;
  let selected = new Set(store.get("players", players).filter((p) => players.includes(p)));
  if (selected.size === 0) selected = new Set(players);
  const champStart = $("#champStart"), skipDays = $("#skipDays"), triesIn = $("#tries");
  champStart.value = store.get("champStart", "none");
  skipDays.value = String(store.get("skipDays", 0));
  triesIn.value = String(store.get("tries", 3));
  let mode = store.get("mode", "player") === "champ" ? "champ" : "player";
  const maxTries = () => Math.min(10, Math.max(1, parseInt(triesIn.value, 10) || 3));

  function applyMode() {
    document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
    document.querySelectorAll(".for-player").forEach((el) => el.style.display = mode === "player" ? "" : "none");
    document.querySelectorAll(".for-champ").forEach((el) => el.style.display = mode === "champ" ? "" : "none");
  }
  document.querySelectorAll("#modes button").forEach((b) => b.onclick = () => {
    if (b.dataset.mode === mode) return;
    mode = b.dataset.mode; store.set("mode", mode); applyMode(); newRound();
  });

  const short = (rid) => rid.split("#")[0];
  const countFor = (p) => D.rounds.filter((r) => r.p === p).length;

  function renderPlayers() {
    $("#players").innerHTML = players.map((p) => `
      <label class="chip ${selected.has(p) ? "on" : ""}" title="${esc(p)}">
        <input type="checkbox" data-p="${esc(p)}" ${selected.has(p) ? "checked" : ""}>
        ${esc(short(p))} <span class="n">${countFor(p)}</span>
      </label>`).join("");
    $("#players").querySelectorAll("input").forEach((cb) => cb.addEventListener("change", () => {
      cb.checked ? selected.add(cb.dataset.p) : selected.delete(cb.dataset.p);
      saveAndRestart();
    }));
    const pool = eligible();
    const ps = new Set(pool.map((r) => r.p));
    $("#pool").textContent = `${pool.length} builds in the pool from ${ps.size} player${ps.size === 1 ? "" : "s"}.`;
  }
  function saveAndRestart() {
    store.set("players", [...selected]);
    store.set("champStart", champStart.value);
    store.set("skipDays", +skipDays.value);
    triesIn.value = String(maxTries());
    store.set("tries", maxTries());
    renderPlayers();
    newRound();
  }
  $("#all").onclick = () => { selected = new Set(players); saveAndRestart(); };
  $("#none").onclick = () => { selected = new Set(); saveAndRestart(); };
  champStart.onchange = saveAndRestart;
  skipDays.onchange = saveAndRestart;
  triesIn.onchange = saveAndRestart;

  // ---------- data helpers ----------
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  const look = (table, id, kind) => (D[table] && D[table][id]) || { name: `${kind} ${id}`, icon: null };
  const iconEl = (o, cls = "") => o.icon
    ? `<img class="${cls}" src="${esc(o.icon)}" alt="${esc(o.name)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:''}))">`
    : `<span class="ph ${cls}"></span>`;
  const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;

  // Guess options: selected players who have at least one build in the pool,
  // so nobody can be eliminated just for having no games.
  function choiceList() {
    const has = new Set(eligible().map((r) => r.p));
    return players.filter((p) => selected.has(p) && has.has(p));
  }

  function eligible() {
    const cutoff = Date.now() - (+skipDays.value) * 86400000;
    return D.rounds.filter((r) => selected.has(r.p) && (+skipDays.value === 0 || r.t < cutoff));
  }

  // ---------- score ----------
  // Separate score per mode; best streaks are remembered per mode.
  const bestKey = (m) => m === "champ" ? "best.champ" : "best";
  const scores = {
    player: { right: 0, total: 0, streak: 0, best: store.get(bestKey("player"), 0) },
    champ:  { right: 0, total: 0, streak: 0, best: store.get(bestKey("champ"), 0) },
  };
  function record(ok) {
    const sc = scores[mode];
    sc.total++;
    if (ok) { sc.right++; sc.streak++; } else sc.streak = 0;
    if (sc.streak > sc.best) { sc.best = sc.streak; store.set(bestKey(mode), sc.best); }
    renderScore();
  }
  function renderScore() {
    const sc = scores[mode];
    $("#score").innerHTML = `<b>${sc.right}/${sc.total}</b><br>streak ${sc.streak} · best ${sc.best}`;
  }

  // ---------- rounds ----------
  const seen = new Set();
  let cur = null, revealed = {}, answered = false;
  // "Which champ?" state for the current round
  let wrong = [], pickQuery = "", pickClass = "";

  function pickRound() {
    const pool = eligible();
    if (!pool.length) return null;
    const byPlayer = {};
    pool.forEach((r) => (byPlayer[r.p] ||= []).push(r));
    const ps = Object.keys(byPlayer);
    // 1) random player, 2) random game of theirs (prefer ones not seen yet)
    const p = ps[Math.floor(Math.random() * ps.length)];
    let opts = byPlayer[p].filter((r) => !seen.has(r.g + "|" + r.p));
    if (!opts.length) { byPlayer[p].forEach((r) => seen.delete(r.g + "|" + r.p)); opts = byPlayer[p]; }
    return opts[Math.floor(Math.random() * opts.length)];
  }

  function newRound() {
    renderScore();
    const choices = choiceList();
    if (choices.length < (mode === "champ" ? 1 : 2)) {
      main.innerHTML = `<div class="card empty-state">Pick at least ${mode === "champ" ? "one player" : "two players"} with games in <b>Players &amp; options</b>.</div>`;
      $("#settings").open = true;
      return;
    }
    cur = pickRound();
    if (!cur) {
      main.innerHTML = `<div class="card empty-state">No games match these settings.<br>Try including more players or skipping fewer days.</div>`;
      return;
    }
    seen.add(cur.g + "|" + cur.p);
    revealed = mode === "champ" ? {}
      : { champ: champStart.value === "champ", cls: champStart.value !== "none" };
    answered = false;
    wrong = []; pickQuery = ""; pickClass = "";
    render();
    if (mode === "champ" && hoverable) { const s = $("#search"); if (s) s.focus(); }
  }

  function render() {
    if (typeof hideTip === "function") hideTip();
    const r = cur;
    const champ = look("champions", r.c, "Champion");
    const roles = (champ.roles || []).map(cap).join(" · ") || "Unknown class";
    const champHtml = revealed.champ
      ? `<div class="portrait">${champ.icon ? `<img src="${esc(champ.icon)}" alt="" onerror="this.replaceWith('?')">` : "?"}</div>
         <div><div class="name">${esc(champ.name)}</div><div class="sub">${esc(roles)}</div></div>`
      : `<div class="portrait">?</div>
         <div><div class="name">${mode === "champ" ? "Which champion?" : "Hidden champion"}</div>
         <div class="sub">${revealed.cls ? esc(roles) : "Class hidden"}</div></div>`;
    const byline = mode === "champ" ? `<div class="byline">Built by <b>${esc(short(r.p))}</b></div>` : "";

    const slots = [...r.items];
    while (slots.length < 6) slots.push(null);
    const itemsHtml = slots.map((id) => {
      if (!id) return `<div class="item empty"><div class="icon"></div></div>`;
      const it = look("items", id, "Item");
      return `<div class="item" data-tip="items:${id}"><div class="icon" data-name="${esc(it.name)}">${it.icon ? `<img src="${esc(it.icon)}" alt="" loading="lazy" onerror="this.replaceWith(this.parentNode.dataset.name)">` : esc(it.name)}</div>
              <div class="label">${esc(it.name)}</div></div>`;
    }).join("");

    const hintBtns = [
      !revealed.champ && !revealed.cls && ["cls", "Champion class"],
      mode === "player" && !revealed.champ && ["champ", "Champion"],
      ["aug", "Augments"],
      ["spells", "Summoner spells"],
      ["kda", "KDA & result"],
      r.foes && r.foes.length && ["foes", "Enemy team"],
    ].filter(Boolean).map(([k, label]) =>
      `<button type="button" data-hint="${k}" ${revealed[k] ? "disabled" : ""}>${label}</button>`).join("");

    let hintOut = "";
    if (revealed.aug) {
      const a = r.aug.map((id) => { const o = look("augments", id, "Augment");
        return `<span class="r-${esc(o.rarity || "")}" data-tip="augments:${id}">${iconEl(o)}${esc(o.name)}</span>`; }).join("");
      hintOut += `<div class="hint"><h4>Augments</h4><div class="mini">${a || "<span>None recorded</span>"}</div></div>`;
    }
    if (revealed.spells) {
      const s = r.spells.filter(Boolean).map((id) => { const o = look("spells", id, "Spell");
        return `<span data-tip="spells:${id}">${iconEl(o)}${esc(o.name)}</span>`; }).join("");
      hintOut += `<div class="hint"><h4>Summoner spells</h4><div class="mini">${s}</div></div>`;
    }
    if (revealed.kda) {
      const [k, d, a] = r.kda;
      hintOut += `<div class="hint"><h4>KDA &amp; result</h4><div class="mini">
        <span><b>${k} / ${d} / ${a}</b></span>
        <span style="color:${r.win ? "var(--good)" : "var(--bad)"}">${r.win ? "Victory" : "Defeat"}</span>
        <span>${Math.round(r.dur / 60)} min</span>
        ${r.dmg ? `<span>${r.dmg.toLocaleString()} dmg to champs</span>` : ""}</div></div>`;
    }

    if (revealed.foes) {
      const f = r.foes.map((id) => { const o = look("champions", id, "Champion");
        return `<span class="foe" title="${esc(o.name)}">${o.icon
          ? `<img src="${esc(o.icon)}" alt="${esc(o.name)}" loading="lazy" onerror="this.replaceWith(this.alt)">`
          : esc(o.name)}</span>`; }).join("");
      hintOut += `<div class="hint"><h4>Enemy team</h4><div class="mini foes">${f}</div></div>`;
    }

    const choices = choiceList();
    const guessHtml = choices.map((p, i) => {
      let cls = "";
      if (answered) cls = p === r.p ? "correct" : (p === answered ? "wrong" : "");
      return `<button type="button" data-guess="${esc(p)}" class="${cls}" ${answered ? "disabled" : ""}>
        <span class="k">${i < 9 ? i + 1 : ""}</span>${esc(short(p))}</button>`;
    }).join("");

    let verdict = "";
    if (answered) {
      const ok = answered === r.p;
      const date = new Date(r.t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      verdict = `<div class="verdict">
        <div><div class="msg ${ok ? "good" : "bad"}">${ok ? "Correct!" : `Nope, it was ${esc(short(r.p))}.`}</div>
        <div class="meta">${esc(champ.name)} · ${date} · ${Math.round(r.dur / 60)} min · ${r.win ? "won" : "lost"}</div></div>
        <button type="button" class="primary" id="next">Next round ↵</button></div>`;
    }

    const bottom = mode === "champ" ? pickerHtml(r) : `
      <section class="card">
        <p class="guess-title">Whose build is this?</p>
        <div class="guesses">${guessHtml}</div>
        ${verdict}
      </section>`;

    main.innerHTML = `
      <section class="card">
        ${byline}
        <div class="champ">${champHtml}</div>
        <div class="items">${itemsHtml}</div>
        <div class="hints">${hintBtns}</div>
        <div class="hint-out">${hintOut}</div>
      </section>
      ${bottom}`;

    main.querySelectorAll("[data-hint]").forEach((b) => b.onclick = () => { revealed[b.dataset.hint] = true; render(); });
    main.querySelectorAll("[data-guess]").forEach((b) => b.onclick = () => guess(b.dataset.guess));
    if (mode === "champ") wirePicker();
    const next = $("#next");
    if (next) { next.onclick = newRound; next.focus(); }
  }

  // ---------- "Which champ?" picker ----------
  const norm = (x) => String(x || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const CLASSES = ["fighter", "tank", "mage", "assassin", "marksman", "support"];
  const allChamps = () => Object.entries(D.champions || {})
    .map(([id, c]) => ({ id: +id, ...c }))
    .filter((c) => c.id > 0 && c.name)
    .sort((a, b) => a.name.localeCompare(b.name));

  function pickerHtml(r) {
    const n = maxTries(), left = n - wrong.length;
    const done = !!answered;
    const pips = "●".repeat(Math.max(0, left)) + "○".repeat(Math.min(n, wrong.length));
    const wrongHtml = wrong.length ? `<div class="wrong-list">Wrong:
      ${wrong.map((id) => { const c = look("champions", id, "Champion");
        return `<span class="w">${iconEl(c)}${esc(c.name)}</span>`; }).join("")}</div>` : "";
    const cards = allChamps().map((c) => {
      let cls = "ch";
      if (wrong.includes(c.id)) cls += " wrong";
      if (done && c.id === r.c) cls += " correct";
      return `<button type="button" class="${cls}" data-champ="${c.id}"
        data-k="${esc(norm(c.name) + " " + norm(c.alias))}" data-roles="${esc((c.roles || []).join(" "))}"
        title="${esc(c.name)}" ${done || wrong.includes(c.id) ? "disabled" : ""}>
        <span class="face">${c.icon ? `<img src="${esc(c.icon)}" alt="" loading="lazy" onerror="this.replaceWith('?')">` : "?"}</span>
        <span class="nm">${esc(c.name)}</span></button>`;
    }).join("");

    let verdict = "";
    if (done) {
      const ok = answered === "win";
      const champ = look("champions", r.c, "Champion");
      const date = new Date(r.t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      verdict = `<div class="verdict">
        <div><div class="msg ${ok ? "good" : "bad"}">${ok
          ? `Correct! ${wrong.length ? `(${wrong.length + 1} guesses)` : "First try!"}`
          : `Out of guesses. It was ${esc(champ.name)}.`}</div>
        <div class="meta">${esc(short(r.p))} · ${date} · ${Math.round(r.dur / 60)} min · ${r.win ? "won" : "lost"}</div></div>
        <button type="button" class="primary" id="next">Next round ↵</button></div>`;
    }

    return `<section class="card picker">
      <div class="pick-head">
        <p class="guess-title">Which champion was this?</p>
        <span class="tries">${done ? "" : `<span class="pips">${pips}</span>${left} of ${n} guess${n === 1 ? "" : "es"} left`}</span>
      </div>
      ${wrongHtml}
      ${verdict}
      ${done ? "" : `<input id="search" class="search" type="search" placeholder="Search champions…" autocomplete="off" value="${esc(pickQuery)}">
      <div class="classes">
        <button type="button" data-cls="" class="${pickClass ? "" : "on"}">All</button>
        ${CLASSES.map((k) => `<button type="button" data-cls="${k}" class="${pickClass === k ? "on" : ""}">${cap(k)}</button>`).join("")}
      </div>`}
      <div class="grid" id="grid">${cards}<div class="none" hidden>No champions match.</div></div>
    </section>`;
  }

  function filterGrid() {
    const q = norm(pickQuery);
    let shown = 0;
    document.querySelectorAll("#grid .ch").forEach((b) => {
      const ok = (!q || b.dataset.k.split(" ").some((k) => k.includes(q)))
              && (!pickClass || b.dataset.roles.split(" ").includes(pickClass));
      b.hidden = !ok;
      if (ok) shown++;
    });
    const none = document.querySelector("#grid .none");
    if (none) none.hidden = shown > 0;
  }

  function firstVisibleChamp() {
    return [...document.querySelectorAll("#grid .ch")].find((b) => !b.hidden && !b.disabled);
  }

  function wirePicker() {
    const search = $("#search");
    if (search) {
      search.oninput = () => { pickQuery = search.value; filterGrid(); };
      search.onkeydown = (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const b = firstVisibleChamp();
          if (b && (pickQuery || pickClass)) guessChamp(+b.dataset.champ);
        } else if (e.key === "Escape") { search.value = ""; pickQuery = ""; filterGrid(); }
      };
    }
    main.querySelectorAll("[data-cls]").forEach((b) => b.onclick = () => {
      pickClass = b.dataset.cls;
      main.querySelectorAll("[data-cls]").forEach((x) => x.classList.toggle("on", x === b));
      filterGrid();
    });
    main.querySelectorAll("#grid .ch").forEach((b) => b.onclick = () => guessChamp(+b.dataset.champ));
    if (!answered) filterGrid();
  }

  function guessChamp(id) {
    if (answered || wrong.includes(id)) return;
    if (id === cur.c) { answered = "win"; record(true); }
    else {
      wrong.push(id);
      if (wrong.length >= maxTries()) { answered = "lose"; record(false); }
    }
    if (answered) revealed.champ = true;
    else { pickQuery = ""; }          // clear the search after a wrong guess
    render();
    const s = $("#search");
    if (s && hoverable) s.focus();
  }

  function guess(p) {
    if (answered) return;
    answered = p;
    revealed.champ = true;
    record(p === cur.p);
    render();
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.id === "search") return;          // handled by the search box
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
    if (answered && (e.key === "Enter" || e.key === " ")) {
      if (e.target.tagName === "BUTTON") return;   // the focused button handles it
      e.preventDefault(); newRound(); return;
    }
    // "Which champ?": start typing anywhere to search
    if (mode === "champ" && !answered && e.key.length === 1 && /[a-z0-9' .&]/i.test(e.key)
        && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const s = $("#search");
      if (s) { e.preventDefault(); s.focus(); s.value += e.key; pickQuery = s.value; filterGrid(); }
      return;
    }
    const n = parseInt(e.key, 10);
    if (mode === "player" && !answered && n >= 1 && n <= 9) {
      const choices = choiceList();
      if (choices[n - 1]) guess(choices[n - 1]);
    }
  });

  // ---------- hover / tap popups ----------
  const tip = $("#tip");
  const RARITY = { kSilver: "Silver augment", kGold: "Gold augment", kPrismatic: "Prismatic augment" };
  let tipFor = null;
  function showTip(el) {
    const [table, id] = el.dataset.tip.split(":");
    const o = (D[table] || {})[id];
    if (!o) return;
    let sub = "";
    if (table === "augments") sub = RARITY[o.rarity] || "Augment";
    if (table === "items" && o.cost) sub = `${o.cost.toLocaleString()} gold`;
    if (table === "spells") sub = "Summoner spell";
    tip.innerHTML = `<div class="t-name">${esc(o.name)}</div>
      ${sub ? `<div class="t-sub">${esc(sub)}</div>` : ""}
      ${o.desc ? `<div class="t-desc">${esc(o.desc)}</div>` : `<div class="t-none">No description available.</div>`}`;
    tip.classList.add("show");
    tipFor = el;
    // position: below the element, flipped above / clamped to stay on screen
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect(), pad = 8;
    let x = Math.min(Math.max(pad, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - pad);
    let y = r.bottom + 8;
    if (y + t.height > innerHeight - pad) y = Math.max(pad, r.top - t.height - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  }
  function hideTip() { tip.classList.remove("show"); tipFor = null; }
  const hoverable = matchMedia("(hover: hover)").matches;
  if (hoverable) {
    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest("[data-tip]");
      if (el && el !== tipFor) showTip(el); else if (!el && tipFor) hideTip();
    });
  }
  // Tap to toggle on touch screens (and click works on desktop too)
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-tip]");
    if (!el) { if (!hoverable) hideTip(); return; }
    if (!hoverable && el === tipFor) hideTip(); else showTip(el);
  });
  addEventListener("scroll", hideTip, { passive: true });

  const gen = new Date(D.generated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  $("#footer").innerHTML = `${D.rounds.length} builds from ${new Set(D.rounds.map((r) => r.g)).size} games · updated ${esc(gen)}`
    + (Object.values(D.augments || {}).some((a) => a.desc)
      ? `<br>Augment descriptions from the <a href="https://wiki.leagueoflegends.com/en-us/ARAM_Mayhem/Augments" style="color:inherit">League of Legends Wiki</a> (CC BY-SA).` : "");

  applyMode();
  renderPlayers();
  newRound();
})();
</script>
</body>
</html>
